name: Build Tivora APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip (kalau source masih berupa .zip)
        run: |
          if [ ! -f settings.gradle.kts ]; then unzip -oq ./*.zip; fi
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: mv app/build/outputs/apk/release/app-release.apk Tivora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tivora-APK
          path: Tivora.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tivora build ${{ github.run_number }}
          files: Tivora.apk
